manual_document_code = "9001002426_I"
user_serviceable_parts = ["drain hose", "drain pipe", "detergent dispenser drawer", "levelling feet"]
reset_supported = true
drain_filter_customer_accessible = true

# Same three codes as WAT28400UC. E:23 is absent here - that absence is the point.
[appliance_models.error_codes]
"E:18" = "Pump is blocked (obstructed). Clean the washer drain hose and/or the drain pipe. Also shown when too much detergent or non-HE detergent was used."
"E:32" = "Not a fault - the unbalanced load detection system has interrupted the spin cycle because the laundry is unevenly distributed. Distribute small and large items of laundry evenly in the drum."
"E:93" = "Hot water tap not turned on, or the hot water supply hose is kinked or pinched closed. Turn on the hot water tap and straighten the hose."

[[appliance_models]]
model_id = "WAT28402UC"
brand = "Bosch"
category = "washing_machine"
manual_id = "boschwat28402ucwasher"
display_name = "Bosch 300 Series WAT28402UC Front-Load Washer"
manual_document_code = "9001427986_A"
user_serviceable_parts = ["drain hose", "drain pipe", "detergent dispenser drawer", "levelling feet"]
reset_supported = true
drain_filter_customer_accessible = true

# E:23 is the STOP-USE code and appears only in this model's manual. Its text is
# the manufacturer's own instruction: turn off the water and call service.
[appliance_models.error_codes]
"E:18" = "Pump is blocked (obstructed). Clean the washer drain hose and/or the drain pipe. Also shown when too much detergent or non-HE detergent was used."
"E:23" = "Water in the base tub, appliance leaking. Turn off the water tap. Call the after-sales service."
"E:32" = "Not a fault - the unbalanced load detection system has interrupted the spin cycle because the laundry is unevenly distributed. Distribute small and large items of laundry evenly in the drum."
"E:93" = "Hot water tap not turned on, or the hot water supply hose is kinked or pinched closed. Turn on the hot water tap and straighten the hose."

[[appliance_models]]
model_id = "WT901CW"
brand = "LG"
category = "washing_machine"
manual_id = "lgwt901cwwasher"
display_name = "LG WT901CW Top-Load Washer"
manual_document_code = "MFL68485601_06"
user_serviceable_parts = ["lint filters", "water inlet filters", "fabric softener cup", "levelling feet"]
reset_supported = false
drain_filter_customer_accessible = true

# From LG document MFL68485601_06. LG uses letter codes, not Bosch-style E:nn -
# a deliberate cross-manufacturer difference the benchmark exercises.
[appliance_models.error_codes]
IE = "Displayed when the water pressure is weak or an inlet filter is clogged with dirt. Clean the inlet filter."
CL = "Not a fault - Child Lock is active. Press and hold the SOIL LEVEL button for five seconds to deactivate it."

[[appliance_models]]
model_id = "WWB020"
brand = "Miele"
category = "washing_machine"
manual_id = "mielewwb020washer"
display_name = "Miele WWB 020 Front-Load Washer"
manual_document_code = "M.-Nr. 10 980 030"
user_serviceable_parts = ["drain filter", "drain pump", "water inlet filter", "detergent drawer", "levelling feet"]
reset_supported = false
# The manual DOES publish a customer drain-filter/drain-pump cleaning procedure. It
# is filed under "Opening the door in the event of a blocked drain outlet and/or
# power outage" rather than under a filter heading, and the problem-solving table
# routes there for "still water in the drum and the machine is unable to drain".
# The odd filing is the point of ac_05b; the accessibility is a fact, not a trap.
drain_filter_customer_accessible = true

# Miele WWB 020 signals faults with INDICATOR LIGHTS on the control field, not with
# numeric or letter error codes. This table is intentionally empty: a customer
# quoting an "E:" or letter code on this model has misread it or misidentified the
# appliance, and the agent must not invent a meaning for it.
[appliance_models.error_codes]

