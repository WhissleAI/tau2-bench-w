# Support-side database for the appliance_care domain.
#
# MODELS AND ERROR CODES ARE REAL. Every model_id below is an exact washing-machine
# model that exists, and every error code and procedure is taken from that model's
# OFFICIAL manufacturer manual. See MANUAL_SOURCES.md for URLs, document codes and
# SHA-256 hashes, and manifest.json for the machine-readable register.
#
# ApplianceCare is a BENCHMARK. It is not affiliated with, authorised by, or endorsed
# by Robert Bosch GmbH / BSH, LG Electronics, or Miele. Manufacturer and model names
# appear as factual references to published documentation.
#
# CUSTOMERS, SERIAL NUMBERS, PURCHASE DATES, WARRANTIES AND SERVICE RECORDS ARE
# SYNTHETIC. No real person or real appliance registration is represented. The
# support policy in manuals/appliancecare-support-policy.md is likewise a synthetic
# benchmark policy and is NOT any manufacturer's real support or warranty policy.
#
# manual_id values match the filenames in manuals/ (stem, with '-' stripped).
#
# Dates are fixed. The frozen 'today' is 2026-03-02 (see utils.get_today).

