# ---------------------------------------------------------------------------
# Appliance models — REAL models, REAL error codes from the official manuals.
#
# The three Bosch models are the disambiguation cluster. They differ by ONE digit,
# each has its OWN manual (different document numbers), and E:23 appears in the
# WAT28402UC manual but NOT in the WAT28400UC or WAT28401UC manuals. That is a
# verified difference, not an invented one, and it is what makes "the customer read
# out E:23" a strong HINT about the model. It is not proof: a code is reported input,
# so the agent must still resolve the customer's appliance_id via list_owned_appliances
# before acting. The code corroborates or contradicts that; it never replaces it.
# ---------------------------------------------------------------------------
[[appliance_models]]
model_id = "WAT28400UC"
brand = "Bosch"
category = "washing_machine"
manual_id = "boschwat28400ucwasher"
display_name = "Bosch 300 Series WAT28400UC Front-Load Washer"
manual_document_code = "9001002399_H"
user_serviceable_parts = ["drain hose", "drain pipe", "detergent dispenser drawer", "levelling feet"]
reset_supported = true
drain_filter_customer_accessible = true

# Verbatim meanings from Bosch document 9001002399_H.
[appliance_models.error_codes]
"E:18" = "Pump is blocked (obstructed). Clean the washer drain hose and/or the drain pipe. Also shown when too much detergent or non-HE detergent was used."
"E:32" = "Not a fault - the unbalanced load detection system has interrupted the spin cycle because the laundry is unevenly distributed. Distribute small and large items of laundry evenly in the drum."
"E:93" = "Hot water tap not turned on, or the hot water supply hose is kinked or pinched closed. Turn on the hot water tap and straighten the hose."

[[appliance_models]]
model_id = "WAT28401UC"
brand = "Bosch"
category = "washing_machine"
manual_id = "boschwat28401ucwasher"
